<body class="h-full flex items-center justify-center p-edge-margin bg-background font-body-md text-on-background">
<!-- Linear/Transactional page: Navigation Shell is suppressed. -->
<div class="w-full max-w-[400px] bg-surface-container-lowest rounded-DEFAULT border border-outline-variant shadow-[0px_4px_20px_rgba(15,23,42,0.05)] p-stack-lg">
<div class="text-center mb-stack-lg flex flex-col items-center">

<h1 class="font-headline-md text-headline-md text-primary tracking-tight">Safe Zones</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-stack-sm">Command Center Authentication</p>
</div>
<form action="#" class="space-y-stack-md" method="POST">
<div>
<label class="block font-label-md text-label-md text-on-surface mb-stack-sm" for="email">Email Address</label>
<input class="w-full h-control-height px-3 border border-outline-variant rounded-DEFAULT bg-surface-container-lowest text-on-surface focus:ring-0 focus:border-primary focus:border-2 transition-colors font-body-md text-body-md" id="email" name="email" required="" type="email"/>
</div>
<div>
<label class="block font-label-md text-label-md text-on-surface mb-stack-sm" for="password">Password</label>
<input class="w-full h-control-height px-3 border border-outline-variant rounded-DEFAULT bg-surface-container-lowest text-on-surface focus:ring-0 focus:border-primary focus:border-2 transition-colors font-body-md text-body-md" id="password" name="password" required="" type="password"/>
</div>
<div>
<label class="block font-label-md text-label-md text-on-surface mb-stack-sm" for="role">Access Role</label>
<select class="w-full h-control-height px-3 border border-outline-variant rounded-DEFAULT bg-surface-container-lowest text-on-surface focus:ring-0 focus:border-primary focus:border-2 transition-colors font-body-md text-body-md appearance-none bg-[url('data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2224%22%20height%3D%2224%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22%231b1b1d%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpolyline%20points%3D%226%209%2012%2015%2018%209%22%3E%3C%2Fpolyline%3E%3C%2Fsvg%3E')] bg-[length:1.2em_1.2em] bg-[right_0.5rem_center] bg-no-repeat pr-8" id="role" name="role">
<option>Administrator</option>
<option>Disaster Management Officer</option>
</select>
</div>
<button class="w-full h-control-height mt-stack-lg bg-[#0F172A] text-on-primary font-label-md text-label-md rounded-DEFAULT hover:opacity-90 transition-opacity flex items-center justify-center gap-2" type="submit">
                Login
                <span class="material-symbols-outlined text-[16px]" data-icon="login">login</span>
</button>
<div class="text-center mt-stack-md">
<a class="font-label-md text-label-md text-on-surface-variant hover:text-primary transition-colors" href="#">Request Access</a>
</div>
</form>
</div>
